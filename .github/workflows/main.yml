name: Geeta Nexus

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Clean Cache and Install Project Dependencies
        run: |
          flutter pub cache clean --force
          flutter pub get

      # Solid Fix: Raw JSON bina kisi decoding ke direct target folder mein safe write hoga
      - name: Setup Firebase Google Services Config
        run: |
          echo '${{ secrets.FIREBASE_SECRET_JSON }}' > android/app/google-services.json

      - name: Configure Production Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Configure Key Properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Build Production APK
        env:
          GEMINI_AI_API_KEY: ${{ secrets.GEMINI_AI_API_KEY }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
        run: |
          # JQ parser aur dynamic loop ko completely remove kar diya hai taaki crash na ho
          # Environment variables ko direct Dart-Define mein secure pass kiya gaya hai
          
          flutter build apk --release \
            --android-skip-build-dependency-validation \
            --dart-define=dart.library.js=false \
            --dart-define=dart.library.html=false \
            --dart-define=GEMINI_AI_API_KEY=$GEMINI_AI_API_KEY \
            --dart-define=HF_API_TOKEN=$HF_API_TOKEN

      - name: Upload Production APK
        uses: actions/upload-artifact@v4
        with:
          name: Production-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
