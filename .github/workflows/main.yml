name: Geeta Nexus

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Configure Google Services
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > android/app/google-services.json

      - name: Configure Production Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Configure Key Properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Auto-Detect Secrets & Build APK
        env:
          GEMINI_AI_API_KEY: ${{ secrets.GEMINI_AI_API_KEY }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
          ALL_SECRETS_JSON: ${{ toJson(secrets) }}
        run: |
          echo "$ALL_SECRETS_JSON" | jq -r 'to_entries|map("\(.key)=\(.value)")|.[]' > .env
          
          DYNAMIC_DART_DEFINES=""
          while IFS= read -r line || [ -n "$line" ]; do
            if [[ "$line" != GOOGLE_SERVICES_JSON=* && "$line" != KEYSTORE_BASE64=* && "$line" != KEYSTORE_PASSWORD=* && "$line" != KEY_PASSWORD=* && "$line" != KEY_ALIAS=* && -n "$line" ]]; then
              DYNAMIC_DART_DEFINES="$DYNAMIC_DART_DEFINES --dart-define=$line"
            fi
          done < .env

          flutter build apk --release --android-skip-build-dependency-validation $DYNAMIC_DART_DEFINES

      - name: Upload Production APK
        uses: actions/upload-artifact@v4
        with:
          name: Production-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
