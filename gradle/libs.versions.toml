[versions]
kotlin                = "2.0.21"
agp                   = "8.5.2"
compose-multiplatform = "1.7.1"
ktor                  = "3.0.3"
koin                  = "4.0.0"
kotlinx-serialization = "1.7.3"
kotlinx-coroutines    = "1.9.0"
androidx-activity     = "1.9.3"
androidx-navigation   = "2.8.4"
androidx-lifecycle    = "2.8.7"
androidx-datastore    = "1.1.1"
androidx-credentials  = "1.3.0"
compose-bom           = "2024.11.00"
media3                = "1.4.1"
bouncycastle          = "1.70"
googleid              = "1.1.1"
coil                  = "2.7.0"

[libraries]
# Ktor
ktor-client-core        = { module = "io.ktor:ktor-client-core",                version.ref = "ktor" }
ktor-client-okhttp      = { module = "io.ktor:ktor-client-okhttp",              version.ref = "ktor" }
ktor-client-darwin      = { module = "io.ktor:ktor-client-darwin",              version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-content-negotiation= { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-logging            = { module = "io.ktor:ktor-client-logging",             version.ref = "ktor" }

# Serialization / Coroutines
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",    version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }

# Koin
koin-core    = { module = "io.insert-koin:koin-core",              version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android",           version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-androidx-compose",  version.ref = "koin" }

# AndroidX
androidx-activity-compose  = { module = "androidx.activity:activity-compose",              version.ref = "androidx-activity" }
androidx-navigation-compose= { module = "androidx.navigation:navigation-compose",          version.ref = "androidx-navigation" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-datastore-prefs   = { module = "androidx.datastore:datastore-preferences",        version.ref = "androidx-datastore" }

# Credentials / Google Sign-In
androidx-credentials          = { module = "androidx.credentials:credentials",                          version.ref = "androidx-credentials" }
androidx-credentials-play     = { module = "androidx.credentials:credentials-play-services-auth",       version.ref = "androidx-credentials" }
googleid                      = { module = "com.google.android.libraries.identity.googleid:googleid",  version.ref = "googleid" }

# Media3 (ExoPlayer)
media3-exoplayer   = { module = "androidx.media3:media3-exoplayer",          version.ref = "media3" }
media3-ui          = { module = "androidx.media3:media3-ui",                 version.ref = "media3" }
media3-session     = { module = "androidx.media3:media3-session",            version.ref = "media3" }
media3-okhttp      = { module = "androidx.media3:media3-datasource-okhttp",  version.ref = "media3" }

# Crypto
bouncycastle = { module = "org.bouncycastle:bcprov-jdk15on", version.ref = "bouncycastle" }

# Image
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }

# Compose BOM (managed)
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }

[plugins]
kotlin-multiplatform       = { id = "org.jetbrains.kotlin.multiplatform",   version.ref = "kotlin" }
kotlin-android             = { id = "org.jetbrains.kotlin.android",         version.ref = "kotlin" }
kotlin-serialization       = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform      = { id = "org.jetbrains.compose",                version.ref = "compose-multiplatform" }
compose-compiler           = { id = "org.jetbrains.kotlin.plugin.compose",  version.ref = "kotlin" }
android-application        = { id = "com.android.application",              version.ref = "agp" }
android-library            = { id = "com.android.library",                  version.ref = "agp" }
