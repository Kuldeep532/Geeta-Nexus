[versions]
kotlin                     = "2.0.21"
agp                        = "8.5.2"
compose-multiplatform      = "1.7.1"
ktor                       = "3.0.3"
kotlinx-serialization      = "1.7.3"
kotlinx-coroutines         = "1.9.0"
koin                       = "4.0.0"
androidx-activity-compose  = "1.9.3"
androidx-navigation-compose = "2.8.4"
androidx-credentials       = "1.3.0"
googleid                   = "1.1.1"
bouncycastle               = "1.70"
lifecycle-viewmodel        = "2.8.7"
datastore                  = "1.1.1"

[plugins]
kotlin-multiplatform  = { id = "org.jetbrains.kotlin.multiplatform",          version.ref = "kotlin" }
kotlin-android        = { id = "org.jetbrains.kotlin.android",                version.ref = "kotlin" }
kotlin-serialization  = { id = "org.jetbrains.kotlin.plugin.serialization",   version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose",                       version.ref = "compose-multiplatform" }
compose-compiler      = { id = "org.jetbrains.kotlin.plugin.compose",         version.ref = "kotlin" }
android-application   = { id = "com.android.application",                     version.ref = "agp" }
android-library       = { id = "com.android.library",                         version.ref = "agp" }

[libraries]
# Ktor
ktor-client-core                = { module = "io.ktor:ktor-client-core",                     version.ref = "ktor" }
ktor-client-okhttp              = { module = "io.ktor:ktor-client-okhttp",                   version.ref = "ktor" }
ktor-client-darwin              = { module = "io.ktor:ktor-client-darwin",                   version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation",      version.ref = "ktor" }
ktor-serialization-json         = { module = "io.ktor:ktor-serialization-kotlinx-json",      version.ref = "ktor" }
ktor-client-logging             = { module = "io.ktor:ktor-client-logging",                  version.ref = "ktor" }

# Kotlinx
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",    version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }

# Koin DI
koin-core    = { module = "io.insert-koin:koin-core",                version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android",             version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-androidx-compose",    version.ref = "koin" }

# AndroidX Compose & Navigation
androidx-activity-compose   = { module = "androidx.activity:activity-compose",          version.ref = "androidx-activity-compose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose",       version.ref = "androidx-navigation-compose" }

# AndroidX Credentials (Google Sign-In via Credential Manager)
androidx-credentials          = { module = "androidx.credentials:credentials",                          version.ref = "androidx-credentials" }
androidx-credentials-play-auth = { module = "androidx.credentials:credentials-play-services-auth",     version.ref = "androidx-credentials" }
googleid                      = { module = "com.google.android.libraries.identity.googleid:googleid",  version.ref = "googleid" }

# BouncyCastle for Ed25519 on JVM/Android
bouncycastle = { module = "org.bouncycastle:bcprov-jdk15on", version.ref = "bouncycastle" }

# Lifecycle / ViewModel
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle-viewmodel" }
lifecycle-runtime-ktx       = { module = "androidx.lifecycle:lifecycle-runtime-ktx",       version.ref = "lifecycle-viewmodel" }

# DataStore (preferences)
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
